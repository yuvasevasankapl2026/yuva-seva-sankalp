<!DOCTYPE html>

<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        रक्तदाता पंजीकरण | युवा सेवा संकल्प फाउंडेशन
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     TOP BAR
===================================== -->

<div class="top-bar">

    <div class="container">

        <div class="left">

            📧 yuvasevasankalp2026@gmail.com

            |

            📞 +91 9651731313

        </div>

    </div>

</div>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="युवा सेवा संकल्प फाउंडेशन लोगो"
        >


        <div class="title">

            <h1 class="main-title">

                युवा सेवा संकल्प फाउंडेशन

            </h1>


            <p class="tagline">

                रक्तदान महादान

            </p>

        </div>

    </div>

</header>


<!-- =====================================
     BLOOD DONOR FORM
===================================== -->

<section class="blood-donor-section">


    <div class="blood-donor-box">


        <h2>

            🩸 रक्तदाता पंजीकरण

        </h2>


        <p class="blood-donor-text">

            रक्तदान करके किसी जरूरतमंद का जीवन बचाने
            के लिए रक्तदाता के रूप में जुड़ें।

        </p>


        <form id="bloodDonorForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="donorName">

                    पूरा नाम *

                </label>


                <input
                    type="text"
                    id="donorName"
                    placeholder="अपना पूरा नाम लिखें"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="donorMobile">

                    मोबाइल नंबर *

                </label>


                <input
                    type="tel"
                    id="donorMobile"
                    placeholder="10 अंकों का मोबाइल नंबर"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- BLOOD GROUP -->

            <div class="form-group">

                <label for="bloodGroup">

                    ब्लड ग्रुप *

                </label>


                <select
                    id="bloodGroup"
                    required
                >

                    <option value="">

                        ब्लड ग्रुप चुनें

                    </option>


                    <option value="A+">

                        A+

                    </option>


                    <option value="A-">

                        A-

                    </option>


                    <option value="B+">

                        B+

                    </option>


                    <option value="B-">

                        B-

                    </option>


                    <option value="AB+">

                        AB+

                    </option>


                    <option value="AB-">

                        AB-

                    </option>


                    <option value="O+">

                        O+

                    </option>


                    <option value="O-">

                        O-

                    </option>

                </select>

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="donorDob">

                    जन्म तिथि *

                </label>


                <input
                    type="date"
                    id="donorDob"
                    required
                >

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label for="donorGender">

                    लिंग *

                </label>


                <select
                    id="donorGender"
                    required
                >

                    <option value="">

                        चुनें

                    </option>


                    <option value="पुरुष">

                        पुरुष

                    </option>


                    <option value="महिला">

                        महिला

                    </option>


                    <option value="अन्य">

                        अन्य

                    </option>

                </select>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="donorAddress">

                    पता *

                </label>


                <textarea
                    id="donorAddress"
                    placeholder="अपना पूरा पता लिखें"
                    required
                ></textarea>

            </div>


            <!-- CITY -->

            <div class="form-group">

                <label for="donorCity">

                    शहर / जिला *

                </label>


                <input
                    type="text"
                    id="donorCity"
                    placeholder="अपना शहर या जिला लिखें"
                    required
                >

            </div>


            <!-- LAST DONATION -->

            <div class="form-group">

                <label for="lastDonation">

                    अंतिम रक्तदान की तारीख

                </label>


                <input
                    type="date"
                    id="lastDonation"
                >

            </div>


            <!-- AGREEMENT -->

            <div class="blood-agreement">

                <input
                    type="checkbox"
                    id="donorAgree"
                    required
                >


                <label for="donorAgree">

                    मैं अपनी जानकारी रक्तदाता सूची में
                    दर्ज करने के लिए सहमत हूँ।

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="blood-donor-btn"
            >

                🩸 रक्तदाता के रूप में जुड़ें

            </button>


            <!-- RESULT -->

            <p
                id="donorResult"
                class="donor-result"
            ></p>


        </form>


        <a
            href="index.html"
            class="back-home"
        >

            ← होम पेज पर जाएँ

        </a>


    </div>


</section>


<!-- =====================================
     FOOTER
===================================== -->

<footer>

    <img
        src="images/logo.png"
        alt="युवा सेवा संकल्प फाउंडेशन लोगो"
        width="70"
    >


    <h3>

        युवा सेवा संकल्प फाउंडेशन

    </h3>


    <p>

        युवा शक्ति, राष्ट्र शक्ति

    </p>


    <p>

        © 2026 All Rights Reserved

    </p>

</footer>


<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>


document
.getElementById("bloodDonorForm")
.addEventListener(

    "submit",

    function(event) {


        event.preventDefault();


        const name =

        document
        .getElementById("donorName")
        .value
        .trim();


        const mobile =

        document
        .getElementById("donorMobile")
        .value
        .trim();


        const bloodGroup =

        document
        .getElementById("bloodGroup")
        .value;


        const dob =

        document
        .getElementById("donorDob")
        .value;


        const gender =

        document
        .getElementById("donorGender")
        .value;


        const address =

        document
        .getElementById("donorAddress")
        .value
        .trim();


        const city =

        document
        .getElementById("donorCity")
        .value
        .trim();


        const lastDonation =

        document
        .getElementById("lastDonation")
        .value;


        const result =

        document
        .getElementById("donorResult");


        /* MOBILE VALIDATION */

        if (

            !/^[0-9]{10}$/.test(mobile)

        ) {


            result.innerHTML =

            "❌ कृपया सही 10 अंकों का मोबाइल नंबर लिखें।";


            result.style.color =

            "red";


            return;


        }


        /* OLD DONOR DATA */

        let donors =

        JSON.parse(

            localStorage.getItem(

                "bloodDonors"

            )

        ) || [];


        /* DONOR ID */

        const donorId =

        "YSSF-BD-2026-" +

        String(

            donors.length + 1

        ).padStart(

            4,

            "0"

        );


        /* DONOR OBJECT */

        const donor = {


            donorId:

            donorId,


            name:

            name,


            mobile:

            mobile,


            bloodGroup:

            bloodGroup,


            dob:

            dob,


            gender:

            gender,


            address:

            address,


            city:

            city,


            lastDonation:

            lastDonation,


            status:

            "सक्रिय",


            registrationDate:

            new Date()

            .toLocaleDateString(

                "hi-IN"

            )


        };


        /* SAVE DONOR */

        donors.push(

            donor

        );


        localStorage.setItem(

            "bloodDonors",

            JSON.stringify(

                donors

            )

        );


        /* SUCCESS */

        result.innerHTML =

        "✅ आपका रक्तदाता पंजीकरण सफल हो गया।" +

        "<br>" +

        "आपकी Donor ID: " +

        "<strong>" +

        donorId +

        "</strong>";


        result.style.color =

        "green";


        /* RESET */

        document
        .getElementById("bloodDonorForm")
        .reset();


    }

);


</script>


</body>

</html>
