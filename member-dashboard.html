<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Dashboard | युवा सेवा संकल्प फाउंडेशन</title>

<link rel="icon" href="images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:#f4f7fa;
    color:#263746;
}

a{
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    height:68px;
    background:#082e63;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand img{
    width:45px;
    height:45px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:3px;
}

.brand-text h1{
    font-size:17px;
    line-height:1.2;
    font-weight:800;
}

.brand-text h1 span{
    color:#ff8a22;
}

.brand-text small{
    display:block;
    color:#c7d8e7;
    font-size:9px;
    margin-top:3px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.top-btn{
    height:38px;
    padding:0 13px;

    border:0;
    border-radius:8px;

    display:flex;
    align-items:center;
    gap:7px;

    cursor:pointer;

    font-size:10px;
    font-weight:800;
}

.website-btn{
    background:rgba(255,255,255,.10);
    color:#fff;
}

.website-btn:hover{
    background:rgba(255,255,255,.18);
}

.logout-btn{
    background:#ff7900;
    color:#fff;
}

.logout-btn:hover{
    background:#e86c00;
}


/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu{
    display:none;

    width:40px;
    height:40px;

    border:0;
    border-radius:8px;

    background:#ff7900;
    color:#fff;

    cursor:pointer;

    margin-right:7px;
}


/* =====================================================
   LAYOUT
===================================================== */

.layout{
    display:flex;
    min-height:calc(100vh - 68px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:245px;
    flex:0 0 245px;

    background:#fff;

    border-right:1px solid #e1e8ee;

    padding:20px 13px;

    position:sticky;
    top:68px;

    height:calc(100vh - 68px);

    overflow-y:auto;

    z-index:900;

    transition:.3s;
}

.sidebar-title{
    padding:0 11px 9px;

    color:#9aa7b3;

    font-size:9px;
    font-weight:800;

    text-transform:uppercase;
}

.menu{
    list-style:none;
    margin-bottom:25px;
}

.menu li{
    margin-bottom:4px;
}

.menu a{
    min-height:43px;

    display:flex;
    align-items:center;
    gap:11px;

    padding:9px 12px;

    border-radius:9px;

    color:#596a79;

    font-size:11px;
    font-weight:700;

    transition:.2s;
}

.menu a i{
    width:19px;
    text-align:center;
    font-size:14px;
}

.menu a:hover{
    background:#f1f5f8;
    color:#123b66;
}

.menu a.active{
    background:#123b66;
    color:#fff;

    box-shadow:
    0 7px 18px rgba(18,59,102,.18);
}

.menu a.active i{
    color:#fff;
}

.menu .orange i{
    color:#ff7900;
}

.menu .green i{
    color:#24834b;
}

.menu .red i{
    color:#d93636;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    flex:1;
    min-width:0;

    padding:27px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:22px;
}

.welcome h2{
    color:#123b66;

    font-size:25px;
    font-weight:800;
}

.welcome p{
    margin-top:3px;

    color:#7b8995;

    font-size:10px;
}

.member-status{
    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 12px;

    background:#fff;

    border:1px solid #dfe7ed;

    border-radius:20px;

    color:#24834b;

    font-size:9px;
    font-weight:800;
}

.member-status i{
    font-size:7px;
}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{
    background:
    linear-gradient(135deg,#123b66,#1d5d96);

    border-radius:17px;

    padding:22px;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    margin-bottom:20px;

    position:relative;
    overflow:hidden;

    box-shadow:
    0 12px 30px rgba(18,59,102,.16);
}

.profile-card:after{
    content:"";

    position:absolute;

    width:240px;
    height:240px;

    border-radius:50%;

    right:-100px;
    top:-120px;

    background:rgba(255,255,255,.06);
}

.profile-left{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:15px;
}

.profile-photo{
    width:72px;
    height:72px;

    border-radius:50%;

    background:#fff;

    border:4px solid rgba(255,255,255,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    flex:0 0 72px;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-photo i{
    color:#7d91a2;
    font-size:28px;
}

.profile-info h3{
    font-size:20px;
    font-weight:800;
}

.profile-info p{
    margin-top:4px;
    color:#d7e5ef;
    font-size:10px;
}

.profile-id{
    display:inline-flex;

    margin-top:7px;

    padding:5px 10px;

    border-radius:20px;

    background:rgba(255,255,255,.12);

    font-size:8px;
    font-weight:800;
}

.profile-actions{
    position:relative;
    z-index:2;

    display:flex;
    gap:8px;
}

.profile-btn{
    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.10);

    color:#fff;

    border-radius:8px;

    padding:9px 12px;

    font-size:9px;
    font-weight:800;

    cursor:pointer;
}

.profile-btn.orange{
    background:#ff7900;
    border-color:#ff7900;
}


/* =====================================================
   STAT CARDS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:14px;

    margin-bottom:20px;
}

.stat{
    background:#fff;

    border:1px solid #e1e8ee;

    border-radius:14px;

    padding:16px;

    display:flex;
    align-items:center;

    gap:11px;

    box-shadow:
    0 5px 18px rgba(18,59,102,.035);

    transition:.25s;
}

.stat:hover{
    transform:translateY(-3px);

    box-shadow:
    0 12px 27px rgba(18,59,102,.10);
}

.stat-icon{
    width:45px;
    height:45px;

    flex:0 0 45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    font-size:18px;
}

.blue .stat-icon{
    background:#eaf1fa;
    color:#123b66;
}

.green .stat-icon{
    background:#eaf7ed;
    color:#24834b;
}

.orange .stat-icon{
    background:#fff0e5;
    color:#ff7900;
}

.red .stat-icon{
    background:#fff0f0;
    color:#d93636;
}

.purple .stat-icon{
    background:#f1edfb;
    color:#7257b8;
}

.stat-info span{
    display:block;

    color:#84919d;

    font-size:9px;
}

.stat-info strong{
    display:block;

    margin-top:2px;

    color:#123b66;

    font-size:18px;
    font-weight:800;
}


/* =====================================================
   GRID
===================================================== */

.dashboard-grid{
    display:grid;

    grid-template-columns:
    1.25fr .85fr;

    gap:18px;
}


/* =====================================================
   BOX
===================================================== */

.box{
    background:#fff;

    border:1px solid #e1e8ee;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
    0 5px 18px rgba(18,59,102,.035);
}

.box-header{
    min-height:53px;

    padding:13px 17px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #edf1f4;
}

.box-header h3{
    color:#123b66;

    font-size:14px;
    font-weight:800;
}

.view{
    color:#ff7900;

    font-size:9px;
    font-weight:800;
}

.box-body{
    padding:17px;
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:10px;
}

.quick{
    min-height:90px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:7px;

    border:1px solid #e2e8ed;

    border-radius:11px;

    color:#536474;

    transition:.2s;
}

.quick i{
    font-size:20px;
    color:#123b66;
}

.quick span{
    font-size:9px;
    font-weight:800;
}

.quick:hover{
    transform:translateY(-3px);

    border-color:#ff7900;

    box-shadow:
    0 8px 20px rgba(0,0,0,.06);
}

.quick:hover i{
    color:#ff7900;
}


/* =====================================================
   NOTICE
===================================================== */

.notice{
    display:flex;
    align-items:flex-start;

    gap:10px;

    padding:11px 0;

    border-bottom:1px solid #edf1f4;
}

.notice:last-child{
    border-bottom:0;
}

.notice-icon{
    width:36px;
    height:36px;

    flex:0 0 36px;

    border-radius:10px;

    background:#fff0e5;

    color:#ff7900;

    display:flex;
    align-items:center;
    justify-content:center;
}

.notice strong{
    display:block;

    color:#425361;

    font-size:10px;
}

.notice small{
    display:block;

    margin-top:3px;

    color:#8996a1;

    font-size:8px;

    line-height:1.5;
}


/* =====================================================
   MEMBERSHIP
===================================================== */

.membership{
    margin-top:18px;
}

.membership-content{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.member-detail{
    padding:14px;

    background:#f8fafc;

    border:1px solid #e4e9ed;

    border-radius:11px;
}

.member-detail span{
    display:block;

    color:#8996a1;

    font-size:8px;
}

.member-detail strong{
    display:block;

    margin-top:4px;

    color:#123b66;

    font-size:12px;
}

.active-badge{
    display:inline-block;

    margin-top:4px;

    padding:4px 8px;

    background:#eaf7ed;

    color:#24834b;

    border-radius:20px;

    font-size:8px;
    font-weight:800;
}


/* =====================================================
   EVENTS
===================================================== */

.event{
    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid #edf1f4;
}

.event:last-child{
    border-bottom:0;
}

.event-date{
    width:43px;
    height:43px;

    flex:0 0 43px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#fff0e5;

    color:#ff7900;
}

.event-date strong{
    font-size:15px;
    line-height:1;
}

.event-date span{
    margin-top:2px;

    font-size:7px;
    font-weight:800;
}

.event-info strong{
    display:block;

    color:#425361;

    font-size:10px;
}

.event-info small{
    display:block;

    margin-top:3px;

    color:#8996a1;

    font-size:8px;
}


/* =====================================================
   SERVICE ACTIVITY
===================================================== */

.service-item{
    display:flex;
    align-items:center;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid #edf1f4;
}

.service-item:last-child{
    border-bottom:0;
}

.service-icon{
    width:36px;
    height:36px;

    flex:0 0 36px;

    border-radius:10px;

    background:#eaf7ed;

    color:#24834b;

    display:flex;
    align-items:center;
    justify-content:center;
}

.service-item strong{
    display:block;

    color:#425361;

    font-size:10px;
}

.service-item small{
    display:block;

    margin-top:3px;

    color:#8996a1;

    font-size:8px;
}


/* =====================================================
   CERTIFICATE
===================================================== */

.certificate{
    margin-top:18px;

    background:
    linear-gradient(135deg,#f0faf3,#f7fbf8);

    border:1px solid #d6eadb;

    border-radius:15px;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.certificate-icon{
    width:48px;
    height:48px;

    flex:0 0 48px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#24834b;

    color:#fff;

    font-size:21px;
}

.certificate-info{
    flex:1;
}

.certificate-info h3{
    color:#24834b;

    font-size:14px;
}

.certificate-info p{
    margin-top:4px;

    color:#657585;

    font-size:9px;
}

.certificate-btn{
    border:0;

    padding:9px 13px;

    border-radius:8px;

    background:#24834b;

    color:#fff;

    font-size:9px;
    font-weight:800;

    cursor:pointer;
}


/* =====================================================
   LOWER GRID
===================================================== */

.lower-grid{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:18px;

    margin-top:18px;
}


/* =====================================================
   PROFILE DETAILS
===================================================== */

.details-grid{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;
}

.detail{
    padding:12px;

    background:#f8fafc;

    border:1px solid #e5eaee;

    border-radius:10px;
}

.detail span{
    display:block;

    color:#8b98a3;

    font-size:8px;
}

.detail strong{
    display:block;

    margin-top:4px;

    color:#405261;

    font-size:10px;
}


/* =====================================================
   NOTIFICATIONS
===================================================== */

.notification{
    display:flex;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid #edf1f4;
}

.notification:last-child{
    border-bottom:0;
}

.notification-icon{
    width:35px;
    height:35px;

    flex:0 0 35px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eef4f8;

    color:#123b66;

    font-size:13px;
}

.notification strong{
    display:block;

    color:#4a5b69;

    font-size:9px;
}

.notification small{
    display:block;

    margin-top:2px;

    color:#8c99a4;

    font-size:8px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    margin-top:22px;

    padding:15px 0 5px;

    border-top:1px solid #e0e7ed;

    display:flex;

    justify-content:space-between;

    gap:15px;

    color:#8996a1;

    font-size:8px;
}

.footer strong{
    color:#123b66;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark{
    background:#101923;
    color:#dce5ec;
}

body.dark .sidebar,
body.dark .box,
body.dark .stat,
body.dark .member-status{
    background:#17232f;
    border-color:#263744;
}

body.dark .welcome h2,
body.dark .box-header h3,
body.dark .stat-info strong{
    color:#fff;
}

body.dark .welcome p,
body.dark .stat-info span{
    color:#8fa1ae;
}

body.dark .menu a{
    color:#aab9c4;
}

body.dark .menu a:hover{
    background:#20303e;
    color:#fff;
}

body.dark .quick,
body.dark .member-detail,
body.dark .detail{
    background:#1c2a36;
    border-color:#2a3b49;
    color:#b9c7d0;
}

body.dark .quick span,
body.dark .member-detail span,
body.dark .detail span{
    color:#92a3af;
}

body.dark .notice,
body.dark .event,
body.dark .service-item,
body.dark .notification{
    border-color:#263744;
}

body.dark .notice strong,
body.dark .event-info strong,
body.dark .service-item strong,
body.dark .notification strong,
body.dark .detail strong{
    color:#dce5ec;
}

body.dark .certificate{
    background:#172d25;
    border-color:#28503a;
}

body.dark .certificate-info p{
    color:#a0b0b9;
}

body.dark .footer{
    border-color:#263744;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
    display:none;

    position:fixed;

    inset:68px 0 0;

    background:rgba(0,0,0,.38);

    z-index:850;
}

.overlay.show{
    display:block;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1250px){

    .stats{
        grid-template-columns:
        repeat(3,1fr);
    }

    .quick-grid{
        grid-template-columns:
        repeat(3,1fr);
    }

}

@media(max-width:1050px){

    .dashboard-grid,
    .lower-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:
        repeat(2,1fr);
    }

}

@media(max-width:800px){

    .mobile-menu{
        display:block;
    }

    .sidebar{
        position:fixed;

        left:-270px;

        top:68px;

        height:calc(100vh - 68px);

        box-shadow:
        10px 0 30px rgba(0,0,0,.12);
    }

    .sidebar.open{
        left:0;
    }

    .main{
        padding:20px 15px;
    }

    .topbar{
        padding:0 13px;
    }

    .website-btn{
        display:none;
    }

}

@media(max-width:650px){

    .profile-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .profile-actions{
        width:100%;
    }

    .profile-btn{
        flex:1;
    }

}

@media(max-width:560px){

    .brand img{
        width:40px;
        height:40px;
    }

    .brand-text h1{
        font-size:14px;
    }

    .brand-text small{
        display:none;
    }

    .logout-btn{
        width:37px;
        padding:0;
        justify-content:center;
        font-size:0;
    }

    .logout-btn i{
        font-size:13px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .welcome{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .welcome h2{
        font-size:21px;
    }

    .quick-grid{
        grid-template-columns:1fr 1fr;
    }

    .membership-content,
    .details-grid{
        grid-template-columns:1fr;
    }

    .certificate{
        flex-direction:column;
        align-items:flex-start;
    }

    .certificate-btn{
        width:100%;
    }

    .footer{
        flex-direction:column;
    }

}

@media(max-width:380px){

    .quick-grid{
        grid-template-columns:1fr;
    }

    .main{
        padding:16px 10px;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

    <div class="brand">

        <button
            class="mobile-menu"
            id="menuBtn">

            <i class="fa-solid fa-bars"></i>

        </button>

        <img
            src="images/logo.png"
            alt="युवा सेवा संकल्प फाउंडेशन">

        <div class="brand-text">

            <h1>
                युवा सेवा संकल्प
                <span>फाउंडेशन</spa
