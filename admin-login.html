<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#082e63">

<title>Admin Login | युवा सेवा संकल्प फाउंडेशन</title>

<link rel="icon" href="images/logo.png">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
    "Noto Sans Devanagari",
    "Mangal",
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(255,121,0,.15),
        transparent 28%
    ),
    radial-gradient(
        circle at 90% 90%,
        rgba(36,131,75,.13),
        transparent 30%
    ),
    linear-gradient(
        135deg,
        #041a38,
        #082e63 50%,
        #155586
    );

    color:#263746;
}


/* =====================================================
   BACKGROUND CIRCLES
===================================================== */

.bg-circle{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
}

.bg-one{
    width:430px;
    height:430px;
    top:-240px;
    left:-200px;
    border:75px solid rgba(255,255,255,.035);
}

.bg-two{
    width:500px;
    height:500px;
    right:-300px;
    bottom:-300px;
    border:80px solid rgba(255,121,0,.04);
}


/* =====================================================
   PAGE
===================================================== */

.page{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px 15px 55px;

    position:relative;
    z-index:2;
}


/* =====================================================
   MAIN CARD
===================================================== */

.login-card{
    width:100%;
    max-width:1080px;

    display:grid;
    grid-template-columns:44% 56%;

    background:#fff;

    border-radius:30px;
    overflow:hidden;

    box-shadow:
    0 35px 90px rgba(0,0,0,.35);
}


/* =====================================================
   LEFT PANEL
===================================================== */

.left-panel{
    position:relative;
    overflow:hidden;

    padding:48px 42px;

    color:#fff;

    background:
    linear-gradient(
        145deg,
        #061e42,
        #0b3568 55%,
        #1d5d96
    );
}

.left-panel::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    right:-260px;
    top:-250px;

    border:70px solid rgba(255,255,255,.035);
}

.left-panel::after{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    left:-170px;
    bottom:-170px;

    background:rgba(255,121,0,.08);
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:15px;

    text-decoration:none;
    color:#fff;
}

.brand img{
    width:82px;
    height:82px;

    object-fit:contain;

    background:#fff;

    padding:5px;

    border-radius:50%;

    box-shadow:
    0 10px 28px rgba(0,0,0,.2);
}

.brand h1{
    font-size:23px;
    line-height:1.35;

    font-weight:800;
}

.brand h1 span{
    color:#ff9a42;
}

.brand p{
    margin-top:4px;

    color:#cbdce9;

    font-size:11px;
    font-weight:600;
}


/* =====================================================
   LEFT CONTENT
===================================================== */

.left-content{
    position:relative;
    z-index:2;

    margin-top:58px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 14px;

    border-radius:30px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.14);

    font-size:10px;
    font-weight:800;
}

.left-content h2{
    margin-top:22px;

    font-size:42px;
    line-height:1.25;

    font-weight:800;
}

.left-content h2 span{
    color:#ff8620;
}

.left-content p{
    margin-top:15px;

    color:#d0dfeb;

    font-size:13px;
    line-height:1.9;
}


/* =====================================================
   FEATURES
===================================================== */

.features{
    margin-top:30px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;
}

.feature{
    min-height:76px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:12px;

    border-radius:13px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.09);

    transition:.25s;
}

.feature:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.10);
}

.feature-icon{
    width:38px;
    height:38px;

    flex:0 0 38px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffad63;

    background:rgba(255,121,0,.12);
}

.feature strong{
    display:block;

    color:#fff;

    font-size:11px;
}

.feature small{
    display:block;

    margin-top:3px;

    color:#a9bfd0;

    font-size:9px;
}


/* =====================================================
   RIGHT PANEL
===================================================== */

.right-panel{
    padding:55px 65px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    background:#fff;
}


/* =====================================================
   TOP ICON
===================================================== */

.login-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.login-icon{
    width:65px;
    height:65px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff1e7;

    color:#ff7900;

    font-size:27px;
}

.secure-status{
    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 12px;

    border-radius:20px;

    background:#edf8f0;

    color:#24834b;

    font-size:10px;

    font-weight:800;
}

.secure-status i{
    font-size:7px;
}


/* =====================================================
   HEADING
===================================================== */

.heading h2{
    color:#123b66;

    font-size:34px;

    font-weight:800;
}

.heading p{
    margin-top:7px;

    color:#71808f;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FORM
===================================================== */

form{
    margin-top:27px;
}

.form-group{
    margin-bottom:19px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:#263746;

    font-size:12px;

    font-weight:800;
}

.input-box{
    position:relative;
}

.input-box > i{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#7c90a1;

    font-size:14px;
}

.input-box input{
    width:100%;
    height:55px;

    padding:0 48px 0 43px;

    border:1px solid #dce5ed;

    border-radius:12px;

    outline:none;

    background:#f8fafc;

    color:#263746;

    font-family:inherit;

    font-size:13px;

    transition:.25s;
}

.input-box input:focus{
    background:#fff;

    border-color:#1d5d96;

    box-shadow:
    0 0 0 4px rgba(29,93,150,.08);
}

.input-box input::placeholder{
    color:#9ba9b5;
}


/* =====================================================
   PASSWORD BUTTON
===================================================== */

.password-toggle{
    position:absolute;

    right:9px;
    top:50%;

    transform:translateY(-50%);

    width:36px;
    height:36px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#758899;

    cursor:pointer;
}

.password-toggle:hover{
    background:#eef3f7;

    color:#123b66;
}


/* =====================================================
   OPTIONS
===================================================== */

.options{
