<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="युवा सेवा संकल्प फाउंडेशन - सुरक्षित Admin Login">

    <meta name="theme-color"
          content="#082e63">

    <title>Admin Login | युवा सेवा संकल्प फाउंडेशन</title>

    <link rel="icon" href="images/logo.png">

    <!-- GOOGLE FONT -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   YSS FOUNDATION
   PREMIUM ADMIN LOGIN
===================================================== */

:root{

    --blue:#082e63;
    --blue2:#123b66;
    --blue3:#1d5d96;

    --orange:#ff7900;
    --orange2:#e76600;

    --green:#24834b;

    --white:#ffffff;

    --text:#263746;
    --muted:#71808f;

    --border:#dce5ed;

    --light:#f5f8fb;

}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    min-height:100vh;

    font-family:
        "Noto Sans Devanagari",
        "Mangal",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,121,0,.13),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(36,131,75,.12),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #041b3b,
            #082e63 48%,
            #124b7d
        );

    color:var(--text);

    overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg-circle{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    z-index:0;
}


.bg-circle.one{

    width:420px;
    height:420px;

    top:-210px;
    left:-180px;

    border:
        1px solid
        rgba(255,255,255,.08);
}


.bg-circle.two{

    width:520px;
    height:520px;

    right:-260px;
    bottom:-250px;

    border:
        70px solid
        rgba(255,121,0,.045);
}


.bg-circle.three{

    width:180px;
    height:180px;

    right:14%;
    top:8%;

    background:
        rgba(255,255,255,.025);
}


/* =====================================================
   PAGE
===================================================== */

.admin-page{

    min-height:100vh;

    position:relative;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:35px 18px 55px;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.admin-shell{

    width:100%;

    max-width:1180px;

    min-height:680px;

    display:grid;

    grid-template-columns:
        43% 57%;

    background:#fff;

    border-radius:30px;

    overflow:hidden;

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.30);
}


/* =====================================================
   LEFT PANEL
===================================================== */

.admin-brand-panel{

    position:relative;

    overflow:hidden;

    padding:50px 45px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #061f45 0%,
            #0b3568 48%,
            #1b5a90 100%
        );
}


.admin-brand-panel::before{

    content:"";

    position:absolute;

    width:430px;
    height:430px;

    border-radius:50%;

    top:-270px;
    right:-250px;

    border:
        75px solid
        rgba(255,255,255,.035);
}


.admin-brand-panel::after{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    border-radius:50%;

    left:-190px;
    bottom:-190px;

    background:
        rgba(255,121,0,.07);
}


/* =====================================================
   BRAND
===================================================== */

.admin-brand{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:16px;
}


.admin-brand img{

    width:86px;
    height:86px;

    object-fit:contain;

    background:#fff;

    padding:5px;

    border-radius:50%;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.20);
}


.admin-brand-text h1{

    font-size:25px;

    line-height:1.3;

    font-weight:800;
}


.admin-brand-text h1 span{

    color:#ff9a3d;
}


.admin-brand-text p{

    margin-top:5px;

    color:#c9d9e8;

    font-size:11px;

    font-weight:600;
}


/* =====================================================
   LEFT CONTENT
===================================================== */

.admin-intro{

    position:relative;

    z-index:2;

    margin-top:65px;
}


.admin-badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 14px;

    border-radius:30px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.14);

    color:#f7fbff;

    font-size:11px;

    font-weight:700;
}


.admin-intro h2{

    margin-top:22px;

    font-size:43px;

    line-height:1.22;

    font-weight:800;
}


.admin-intro h2 span{

    color:#ff8a20;
}


.admin-intro p{

    margin-top:16px;

    max-width:430px;

    color:#d2e0ec;

    font-size:13px;

    line-height:1.9;
}


/* =====================================================
   ADMIN FEATURES
===================================================== */

.admin-features{

    margin-top:32px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}


.admin-feature{

    min-height:82px;

    padding:14px;

    display:flex;

    align-items:center;

    gap:11px;

    border-radius:14px;

    background:
        rgba(255,255,255,.065);

    border:
        1px solid
        rgba(255,255,255,.08);

    transition:.25s;
}


.admin-feature:hover{

    background:
        rgba(255,255,255,.10);

    transform:translateY(-2px);
}


.admin-feature-icon{

    width:39px;
    height:39px;

    flex:0 0 39px;

    border-radius:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ffac61;

    background:
        rgba(255,121,0,.10);
}


.admin-feature strong{

    display:block;

    font-size:11px;

    color:#fff;
}


.admin-feature small{

    display:block;

    margin-top:3px;

    color:#abc1d3;

    font-size:9px;

}


/* =====================================================
   RIGHT PANEL
===================================================== */

.admin-login-panel{

    padding:55px 65px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    background:#fff;
}


/* =====================================================
   LOGIN TOP
===================================================== */

.login-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:28px;
}


.login-icon-box{

    width:65px;
    height:65px;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--orange);

    background:
        linear-gradient(
            135deg,
            #fff4ec,
            #ffeadb
        );

    font-size:27px;
}


.secure-status{

    display:flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    border-radius:20px;

    color:var(--green);

    background:#edf8f0;

    font-size:10px;

    font-weight:800;
}


.secure-status i{

    font-size:8px;
}


/* =====================================================
   HEADING
===================================================== */

.login-heading h2{

    color:var(--blue2);

    font-size:33px;

    font-weight:800;
}


.login-heading p{

    margin-top:6px;

    color:var(--muted);

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FORM
===================================================== */

.login-form{

    margin-top:28px;
}


.form-group{

    margin-bottom:19px;
}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:#263746;

    font-size:12px;

    font-weight:800;
}


.input-box{

    position:relative;
}


.input-box > .left-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:#7d91a2;

    font-size:14px;

    pointer-events:none;
}


.input-box input{

    width:100%;

    height:55px;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    outline:none;

    background:#f8fafc;

    color:#263746;

    font-family:inherit;

    font-size:13px;

    padding:
        0 48px 0 43px;

    transition:.25s;
}


.input-box input:hover{

    border-color:#c7d4df;
}


.input-box input:focus{

    background:#fff;

    border-color:#1d5d96;

    box-shadow:
        0 0 0 4px
        rgba(29,93,150,.08);
}


.input-box input::placeholder{

    color:#9aa8b5;
}


/* =====================================================
   PASSWORD TOGGLE
=====================================================
