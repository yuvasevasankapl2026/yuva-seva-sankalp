<!-- HEADER -->

<header class="header">

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="युवा सेवा संकल्प फाउंडेशन लोगो"
        >


        <div class="title">

            <h1 class="main-title">

                युवा सेवा संकल्प फाउंडेशन

            </h1>


            <p class="tagline">

                युवा शक्ति, राष्ट्र शक्ति

            </p>

        </div>

    </div>

</header>


<!-- ADMIN LOGIN -->

<section class="admin-login-section">

    <div class="admin-login-box">

        <h2>

            एडमिन लॉगिन

        </h2>


        <p>

            एडमिन पैनल में प्रवेश करने के लिए
            अपनी जानकारी भरें।

        </p>


        <form id="adminLoginForm">


            <div class="form-group">

                <label>

                    एडमिन यूज़रनेम

                </label>


                <input
                    type="text"
                    id="adminUsername"
                    placeholder="यूज़रनेम लिखें"
                    required
                >

            </div>


            <div class="form-group">

                <label>

                    पासवर्ड

                </label>


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="पासवर्ड लिखें"
                    required
                >

            </div>


            <p
                id="loginMessage"
                class="login-message"
            >

            </p>


            <button
                type="submit"
                class="admin-login-btn"
            >

                लॉगिन करें

            </button>


        </form>


        <a
            href="index.html"
            class="back-home"
        >

            ← होम पेज पर जाएँ

        </a>

    </div>

</section>
