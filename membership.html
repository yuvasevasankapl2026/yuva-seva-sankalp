<section id="member">

    <div class="container">

        <h2>सदस्यता लें</h2>

        <p class="member-text">
            युवा सेवा संकल्प फाउंडेशन से जुड़ें और
            समाज सेवा के कार्यों में अपना योगदान दें।
        </p>

        <form class="member-form">

            <input
                type="text"
                placeholder="पूरा नाम"
                required
            >

            <input
                type="tel"
                placeholder="मोबाइल नंबर"
                required
            >

            <input
                type="email"
                placeholder="ईमेल पता"
            >

            <textarea
                placeholder="पूरा पता"
                rows="4"
                required
            ></textarea>

            <select required>

                <option value="">
                    सदस्यता का प्रकार चुनें
                </option>

                <option>
                    सामान्य सदस्य
                </option>

                <option>
                    सक्रिय सदस्य
                </option>

                <option>
                    आजीवन सदस्य
                </option>

            </select>

            <button type="submit">
                सदस्यता के लिए आवेदन करें
            </button>

        </form>

    </div>

</section>
