<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="युवा सेवा संकल्प फाउंडेशन वॉलंटियर लॉगिन पेज">

<title>
    Volunteer Login | युवा सेवा संकल्प फाउंडेशन
</title>


<!-- GOOGLE FONT -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<!-- FONT AWESOME -->

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#123b66;
    --blue2:#1d5d96;
    --orange:#ff7900;
    --green:#24834b;
    --red:#d93636;
    --dark:#082e63;
    --text:#263746;
    --muted:#71808f;
    --light:#f4f7fa;
    --white:#ffffff;
    --border:#dfe7ed;
}

body{
    margin:0;
    background:var(--light);
    color:var(--text);

    font-family:
        "Noto Sans Devanagari",
        "Mangal",
        Arial,
        sans-serif;
}

a{
    text-decoration:none;
}


/* =====================================================
   TOP BAR
===================================================== */

.vol-topbar{
    background:var(--blue);
    color:#fff;
    min-height:42px;
}

.vol-topbar-inner{
    width:92%;
    max-width:1400px;
    margin:auto;

    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.vol-contact{
    display:flex;
    align-items:center;
    gap:25px;
}

.vol-contact span{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:12px;
}

.vol-contact i,
.vol-social i{
    color:#ffb15c;
}

.vol-social{
    display:flex;
    align-items:center;
    gap:14px;
}

.vol-social a{
    color:#fff;
    transition:.2s;
}

.vol-social a:hover{
    color:var(--orange);
}

.vol-phone{
    color:#fff;
    font-size:12px;
}


/* =====================================================
   HEADER
===================================================== */

.vol-header{
    background:#fff;
    border-bottom:1px solid #e2e8ed;
}

.vol-header-inner{
    width:92%;
    max-width:1400px;
    min-height:135px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:30px;
}

.vol-brand{
    display:flex;
    align-items:center;
    gap:18px;

    color:var(--blue);
}

.vol-logo{
    width:110px;
    height:110px;

    object-fit:contain;
}

.vol-brand h1{
    font-size:36px;
    line-height:1.2;
    font-weight:800;
}

.vol-brand h1 span{
    color:var(--orange);
}

.vol-brand p{
    margin-top:6px;

    color:var(--blue);

    font-size:16px;
    font-weight:700;
}


/* =====================================================
   HEADER LOGIN CARDS
===================================================== */

.vol-login-cards{
    display:flex;
    gap:10px;
}

.login-card{
    min-width:160px;

    padding:10px 13px;

    display:flex;
    align-items:center;
    gap:10px;

    border-radius:11px;

    border:1px solid #dce4eb;

    color:var(--blue);

    background:#fff;

    transition:.25s;
}

.login-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 9px 22px rgba(18,59,102,.12);
}

.login-card-icon{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.member-card .login-card-icon{
    background:#eaf7ed;
    color:var(--green);
}

.volunteer-card{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
}

.volunteer-card .login-card-icon{
    background:rgba(255,255,255,.15);
    color:#fff;
}

.admin-card{
    background:var(--orange);
    color:#fff;
    border-color:var(--orange);
}

.admin-card .login-card-icon{
    background:rgba(255,255,255,.15);
    color:#fff;
}

.login-card strong{
    display:block;
    font-size:12px;
}

.login-card small{
    display:block;
    margin-top:3px;
    font-size:8px;
    opacity:.75;
}


/* =====================================================
   NAVIGATION
===================================================== */

.vol-nav{
    background:var(--dark);
    min-height:55px;
}

.vol-nav-inner{
    width:92%;
    max-width:1400px;

    min-height:55px;

    margin:auto;

    display:flex;
    align-items:stretch;

    overflow-x:auto;
}

.vol-nav-link{
    min-height:55px;

    padding:0 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    color:#fff;

    font-size:12px;
    font-weight:700;

    white-space:nowrap;

    transition:.2s;
}

.vol-nav-link:hover,
.vol-nav-link.active{
    background:var(--orange);
}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb{
    background:#eef3f8;

    border-bottom:1px solid #dfe7ee;
}

.breadcrumb-inner{
    width:92%;
    max-width:1400px;

    min-height:45px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:9px;

    color:#69798a;

    font-size:11px;
}

.breadcrumb a{
    color:var(--blue);
    font-weight:700;
}

.breadcrumb i{
    color:var(--orange);
}


/* =====================================================
   LOGIN SECTION
===================================================== */

.login-section{
    width:92%;
    max-width:1150px;

    margin:45px auto 65px;
}

.login-wrapper{
    display:grid;

    grid-template-columns:1fr 1fr;

    background:#fff;

    border:1px solid var(--border);

    border-radius:25px;

    overflow:hidden;

    box-shadow:
        0 20px 55px rgba(18,59,102,.11);
}


/* =====================================================
   LEFT PANEL
===================================================== */

.login-left{
    position:relative;

    padding:55px 45px;

    color:#fff;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #123b66,
            #1d5d96 60%,
            #24834b
        );
}

.login-left:before{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    right:-170px;
    top:-170px;

    background:
        rgba(255,255,255,.07);
}

.login-left:after{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    border-radius:50%;

    left:-120px;
    bottom:-120px;

    background:
        rgba(255,121,0,.12);
}

.login-left-content{
    position:relative;
    z-index:2;
}

.login-badge{
    width:72px;
    height:72px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.13);

    font-size:31px;

    margin-bottom:25px;
}

.login-left h2{
    font-size:38px;
    line-height:1.3;

    font-weight:800;

    margin-bottom:15px;
}

.login-left p{
    color:#e5eef5;

    font-size:14px;

    line-height:1.9;
}

.benefits{
    margin-top:32px;

    display:flex;
    flex-direction:column;

    gap:14px;
}

.benefit{
    display:flex;
    align-items:center;

    gap:11px;

    font-size:12px;
}

.benefit-icon{
    width:38px;
    height:38px;

    flex:0 0 38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        rgba(255,255,255,.13);
}


/* =====================================================
   RIGHT LOGIN
===================================================== */

.login-right{
    padding:55px 50px;

    display:flex;
    flex-direction:column;

    justify-content:center;
}

.login-heading h2{
    color:var(--blue);

    font-size:30px;

    font-weight:800;
}

.login-heading p{
    margin-top:7px;

    color:var(--muted);

    font-size:12px;
}


/* =====================================================
   FORM
===================================================== */

.form{
    margin-top:28px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:var(--blue);

    font-size:12px;
    font-weight:800;
}

.input-box{
    position:relative;
}

.input-box > i{
    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:#81909e;
}

.input-box input{
    width:100%;

    height:53px;

    padding:
        0 47px 0 45px;

    border:
        1px solid #d7e1e9;

    border-radius:10px;

    outline:none;

    background:#fff;

    color:var(--text);

    font-family:inherit;

    font-size:13px;

    transition:.2s;
}

.input-box input:focus{
    border-color:var(--blue2);

    box-shadow:
        0 0 0 4px
        rgba(29,93,150,.09);
}

.password-btn{
    position:absolute;

    right:8px;
    top:50%;

    transform:
        translateY(-50%);

    width:38px;
    height:38px;

    border:0;

    background:transparent;

    color:#71808f;

    cursor:pointer;

    border-radius:8px;
}

.password-btn:hover{
    background:#f0f4f7;
}


/* =====================================================
   OPTIONS
===================================================== */

.options{
    margin:
        3px 0 22px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.remember{
    display:flex;

    align-items:center;

    gap:7px;

    color:#647484;

    font-size:10px;
}

.remember input{
    accent-color:var(--blue);
}

.forgot{
    color:var(--blue2);

    font-size:10px;

    font-weight:800;
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{
    width:100%;

    min-height:54px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #123b66,
            #1d5d96
        );

    color:#fff;

    font-family:inherit;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    transition:.25s;
}

.login-btn:hover{
    transform:
        translateY(-2px);

    box-shadow:
        0 10px 22px
        rgba(18,59,102,.18);
}

.login-btn.loading{
    opacity:.75;
    pointer-events:none;
}


/* =====================================================
   RESULT
===================================================== */

.login-result{
    min-height:22px;

    margin-top:12px;

    text-align:center;

    font-size:11px;

    font-weight:800;
}


/* =====================================================
   DEMO DETAILS
===================================================== */

.demo-box{
    margin-top:18px;

    padding:12px 14px;

    border-radius:10px;

    background:#f4f8fb;

    border:1px solid #dfe7ed;

    font-size:10px;

    color:#647484;

    line-height:1.7;
}

.demo-box strong{
    color:var(--blue);
}

.demo-box code{
    padding:3px 6px;

    border-radius:5px;

    background:#e8eef3;

    color:var(--blue);

    font-weight:800;
}


/* =====================================================
   REGISTER
===================================================== */

.register{
    margin-top:22px;

    padding-top:20px;

    border-top:
        1px solid #e4eaef;

    text-align:center;
}

.register p{
    margin-bottom:11px;

    color:#71808f;

    font-size:11px;
}

.register a{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:10px 18px;

    border:
        1px solid var(--orange);

    border-radius:8px;

    color:var(--orange);

    font-size:11px;

    font-weight:800;

    transition:.2s;
}

.register a:hover{
    background:var(--orange);

    color:#fff;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    background:#092e60;

    color:#fff;

    padding:
        40px 0 0;
}

.footer-inner{
    width:92%;
    max-width:1400px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1.5fr 1fr 1fr 1.3fr;

    gap:35px;
}

.footer-logo{
    width:80px;
    height:80px;

    object-fit:contain;

    margin-bottom:10px;
}

.footer h3,
.footer h4{
    margin-bottom:12px;
}

.footer p,
.footer a{
    color:#d9e5ee;

    font-size:11px;

    line-height:1.7;
}

.footer a{
    display:block;

    margin-bottom:7px;
}

.footer a:hover{
    color:var(--orange);
}

.footer-bottom{
    margin-top:30px;

    padding:16px;

    border-top:
        1px solid
        rgba(255,255,255,.15);

    text-align:center;

    color:#d9e5ee;

    font-size:10px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1150px){

    .vol-header-inner{
        flex-direction:column;

        padding:18px 0;
    }

    .vol-login-cards{
        width:100%;

        justify-content:center;
    }

    .footer-inner{
        grid-template-columns:
            1fr 1fr;
    }

}


@media(max-width:850px){

    .vol-contact span:first-child{
        display:none;
    }

    .login-wrapper{
        grid-template-columns:1fr;
    }

    .login-left{
        padding:42px 32px;
    }

    .login-right{
        padding:42px 32px;
    }

}


@media(max-width:650px){

    .vol-topbar-inner{
        justify-content:center;
    }

    .vol-contact{
        display:none;
    }

    .vol-social{
        width:100%;
        justify-content:center;
    }

    .vol-brand{
        flex-direction:column;

        text-align:center;
    }

    .vol-brand h1{
        font-size:28px;
    }

    .vol-brand p{
        font-size:14px;
    }

    .vol-login-cards{
        flex-direction:column;
        align-items:center;
    }

    .login-card{
        width:100%;
        max-width:340px;
    }

    .login-section{
        width:94%;

        margin:
            25px auto 45px;
    }

    .login-left{
        padding:35px 22px;
    }

    .login-left h2{
        font-size:29px;
    }

    .login-right{
        padding:35px 20px;
    }

    .login-heading h2{
        font-size:26px;
    }

    .options{
        flex-direction:column;

        align-items:flex-start;

        gap:10px;
    }

    .footer-inner{
        grid-template-columns:1fr;
    }

}


@media(max-width:420px){

    .vol-logo{
        width:90px;
        height:90px;
    }

    .vol-brand h1{
        font-size:24px;
    }

    .login-left h2{
        font-size:26px;
    }

}

</style>

</head>
