<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | युवा सेवा संकल्प फाउंडेशन</title>

<link rel="icon" href="images/logo.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:#f4f7fa;
    color:#263746;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    height:70px;
    background:#082e63;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:48px;
    height:48px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:3px;
}

.brand h1{
    font-size:18px;
    line-height:1.25;
}

.brand span{
    color:#ff8a22;
}

.brand small{
    display:block;
    color:#c7d8e7;
    font-size:9px;
    margin-top:2px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.website-btn,
.logout-btn{
    border:0;
    text-decoration:none;

    display:flex;
    align-items:center;
    gap:7px;

    padding:10px 15px;

    border-radius:9px;

    font-family:inherit;
    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.website-btn{
    background:rgba(255,255,255,.1);
    color:#fff;
}

.logout-btn{
    background:#ff7900;
    color:#fff;
}


/* =====================================================
   LAYOUT
===================================================== */

.layout{
    display:flex;
    min-height:calc(100vh - 70px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:250px;
    flex:0 0 250px;

    background:#fff;

    border-right:1px solid #e1e8ee;

    padding:22px 14px;

    position:sticky;
    top:70px;

    height:calc(100vh - 70px);

    overflow-y:auto;
}

.sidebar-title{
    padding:0 12px 12px;

    color:#8a98a5;

    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
}

.menu{
    list-style:none;
}

.menu li{
    margin-bottom:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 13px;

    border-radius:10px;

    color:#526271;

    text-decoration:none;

    font-size:12px;
    font-weight:700;

    transition:.2s;
}

.menu a i{
    width:20px;
    text-align:center;
    font-size:14px;
}

.menu a:hover{
    background:#f1f5f8;
    color:#123b66;
}

.menu a.active{
    background:#123b66;
    color:#fff;

    box-shadow:
    0 7px 18px rgba(18,59,102,.18);
}

.menu .orange i{
    color:#ff7900;
}

.menu a.active i{
    color:#fff;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    flex:1;
    padding:30px;
    min-width:0;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}

.welcome h2{
    color:#123b66;
    font-size:27px;
    font-weight:800;
}

.welcome p{
    margin-top:4px;
    color:#71808f;
    font-size:11px;
}

.admin-badge{
    display:flex;
    align-items:center;
    gap:8px;

    background:#fff;

    border:1px solid #e0e7ed;

    padding:10px 14px;

    border-radius:10px;

    color:#24834b;

    font-size:10px;
    font-weight:800;
}

.admin-badge i{
    font-size:8px;
}


/* =====================================================
   STAT CARDS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;

    margin-bottom:25px;
}

.stat-card{
    background:#fff;

    border:1px solid #e1e8ee;

    border-radius:16px;

    padding:20px;

    display:flex;
    align-items:center;

    gap:15px;

    box-shadow:0 5px 18px rgba(18,59,102,.04);

    transition:.25s;
}

.stat-card:hover{
    transform:translateY(-4px);

    box-shadow:
    0 12px 28px rgba(18,59,102,.10);
}

.stat-icon{
    width:54px;
    height:54px;

    flex:0 0 54px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    font-size:21px;
}

.blue .stat-icon{
    background:#eaf1fa;
    color:#123b66;
}

.green .stat-icon{
    background:#eaf7ed;
    color:#24834b;
}

.orange .stat-icon{
    background:#fff0e5;
    color:#ff7900;
}

.red .stat-icon{
    background:#fff0f0;
    color:#d93636;
}

.stat-text span{
    display:block;
    color:#81909d;
    font-size:10px;
}

.stat-text strong{
    display:block;
    margin-top:3px;
    color:#123b66;
    font-size:25px;
    font-weight:800;
}


/* =====================================================
   GRID
===================================================== */

.dashboard-grid{
    display:grid;

    grid-template-columns:
    1.5fr 1fr;

    gap:20px;
}


/* =====================================================
   BOX
===================================================== */

.box{
    background:#fff;

    border:1px solid #e1e8ee;

    border-radius:16px;

    box-shadow:
    0 5px 18px rgba(18,59,102,.04);

    overflow:hidden;
}

.box-header{
    padding:17px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #edf1f4;
}

.box-header h3{
    color:#123b66;
    font-size:15px;
}

.view-all{
    color:#ff7900;
    font-size:10px;
    font-weight:800;
    text-decoration:none;
}

.box-body{
    padding:20px;
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;
}

.quick{
    min-height:100px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;

    border:1px solid #e3e9ee;

    border-radius:12px;

    text-decoration:none;

    color:#526271;

    transition:.2s;
}

.quick i{
    font-size:22px;
    color:#123b66;
}

.quick span{
    font-size:10px;
    font-weight:700;
}

.quick:hover{
    border-color:#ff7900;
    transform:translateY(-3px);
    box-shadow:0 8px
