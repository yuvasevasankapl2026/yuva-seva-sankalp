<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuva Seva Sankalp Foundation</title>
<style>
/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#333;
    line-height:1.7;
}

/* ===== HEADER ===== */

header{
    background:linear-gradient(135deg,#0b6b3a,#138f5a);
    color:#fff;
    text-align:center;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

header h1{
    font-size:42px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

/* ===== NAVBAR ===== */

nav{
    background:#044d2a;
    position:sticky;
    top:0;
    z-index:1000;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
    flex-wrap:wrap;
}

nav ul li a{
    display:block;
    color:white;
    padding:16px 22px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

nav ul li a:hover{
    background:#18a35d;
}

/* ===== HERO ===== */

.hero{
    height:90vh;
    background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("hero.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero h2{
    font-size:55px;
}

.hero p{
    margin:20px 0;
    font-size:22px;
    max-width:800px;
}

.btn{
    background:#ff9800;
    color:white;
    padding:14px 35px;
    text-decoration:none;
    border-radius:30px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    background:#ff7700;
}

/* ===== SECTION ===== */

section{
    padding:70px 10%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title h2{
    font-size:38px;
    color:#0b6b3a;
}

/* ===== CARDS ===== */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h3{
    color:#0b6b3a;
    margin-bottom:15px;
}

/* ===== COUNTER ===== */

.counter{
    background:#0b6b3a;
    color:white;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    text-align:center;
    padding:60px 20px;
}

.counter h2{
    font-size:45px;
}

.counter p{
    font-size:18px;
}

/* ===== GALLERY ===== */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    border-radius:10px;
}

/* ===== CONTACT ===== */

.contact{
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.contact input,
.contact textarea{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

.contact button{
    background:#0b6b3a;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:8px;
    cursor:pointer;
}

/* ===== FOOTER ===== */

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
}

footer a{
    color:#7fffad;
    text-decoration:none;
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

header h1{
font-size:30px;
}

.hero h2{
font-size:36px;
}

.hero p{
font-size:18px;
}

nav ul{
flex-direction:column;
}

}
</style>
</head>
<body>

<header>
<h1>Yuva Seva Sankalp Foundation</h1>
<p>Education | Health | Social Welfare | Skill Development</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Programs</a>
<a href="#">Gallery</a>
<a href="#">Donate</a>
<a href="#">Contact</a>
</nav>

<section class="hero">
<h2>Welcome to Yuva Seva Sankalp Foundation</h2>
<p>Serving Society with Dedication and Humanity.</p>
<a class="btn" href="#">Join Us</a>
</section>

<footer>
© 2026 Yuva Seva Sankalp Foundation. All Rights Reserved.
</footer>
<script src="script.js"></script>
</body>
</html>
