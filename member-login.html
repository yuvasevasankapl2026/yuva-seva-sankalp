<!DOCTYPE html>

<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        सदस्य लॉगिन | युवा सेवा संकल्प फाउंडेशन
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- TOP BAR -->

<div class="top-bar">

    <div class="container">

        <div class="left">

            🔐 सदस्य लॉगिन

        </div>

    </div>

</div>


<!-- HEADER -->

<header class="header">

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="युवा सेवा संकल्प फाउंडेशन लोगो"
        >


        <div class="title">

            <h1 class="main-title">

                युवा सेवा संकल्प फाउंडेशन

            </h1>


            <p class="tagline">

                युवा शक्ति, राष्ट्र शक्ति

            </p>

        </div>

    </div>

</header>


<!-- MEMBER LOGIN -->

<section class="admin-login-section">

    <div class="admin-login-box">


        <h2>

            सदस्य लॉगिन

        </h2>


        <p>

            अपनी Member ID और मोबाइल नंबर डालें।

        </p>


        <form id="memberLoginForm">


            <!-- MEMBER ID -->

            <div class="form-group">

                <label for="memberId">

                    Member ID

                </label>


                <input
                    type="text"
                    id="memberId"
                    placeholder="जैसे: YSSF-2026-0001"
                    required
                >

            </div>


            <!-- MOBILE NUMBER -->

            <div class="form-group">

                <label for="memberMobile">

                    मोबाइल नंबर

                </label>


                <input
                    type="tel"
                    id="memberMobile"
                    placeholder="10 अंकों का मोबाइल नंबर"
                    maxlength="10"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="admin-login-btn"
            >

                लॉगिन करें

            </button>


        </form>


        <!-- MEMBER DETAILS -->

        <div
            id="memberProfile"
            class="member-profile"
            style="display: none;"
        >

            <h2>

                सदस्य की जानकारी

            </h2>


            <p>

                <strong>
                    Member ID:
                </strong>

                <span id="profileMemberId"></span>

            </p>


            <p>

                <strong>
                    नाम:
                </strong>

                <span id="profileName"></span>

            </p>


            <p>

                <strong>
                    मोबाइल:
                </strong>

                <span id="profileMobile"></span>

            </p>


            <p>

                <strong>
                    सदस्यता:
                </strong>

                <span id="profileMembership"></span>

            </p>


            <p>

                <strong>
                    स्थिति:
                </strong>

                <span id="profileStatus"></span>

            </p>


            <button
                type="button"
                class="logout-btn"
                onclick="memberLogout()"
            >

                लॉगआउट करें

            </button>

        </div>


        <a
            href="index.html"
            class="back-home"
        >

            ← होम पेज पर जाएँ

        </a>


    </div>

</section>


<!-- FOOTER -->

<footer>

    <img
        src="images/logo.png"
        alt="युवा सेवा संकल्प फाउंडेशन लोगो"
        width="70"
    >


    <h3>

        युवा सेवा संकल्प फाउंडेशन

    </h3>


    <p>

        युवा शक्ति, राष्ट्र शक्ति

    </p>


    <p>

        © 2026 युवा सेवा संकल्प फाउंडेशन

    </p>

</footer>


<!-- MEMBER LOGIN JAVASCRIPT -->

<script src="member-login.js"></script>


</body>

</html>
