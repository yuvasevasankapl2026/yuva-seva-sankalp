<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        सदस्य लॉगिन
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="लोगो"
        >


        <div class="title">

            <h1 class="main-title">

                युवा सेवा संकल्प फाउंडेशन

            </h1>


            <p class="tagline">

                सदस्य लॉगिन

            </p>

        </div>

    </div>

</header>


<section class="admin-login-section">


    <div class="admin-login-box">


        <h2>

            सदस्य लॉगिन

        </h2>


        <p>

            अपनी Member ID और मोबाइल नंबर डालें।

        </p>


        <form id="memberLoginForm">


            <div class="form-group">

                <label for="memberId">

                    Member ID

                </label>


                <input
                    type="text"
                    id="memberId"
                    placeholder="YSSF-2026-0001"
                    required
                >

            </div>


            <div class="form-group">

                <label for="memberMobile">

                    पासवर्ड

                </label>


                <input
                    type="password"
                    id="memberMobile"
                    placeholder="मोबाइल नंबर लिखें"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <p
                id="memberMessage"
                class="login-message"
            ></p>


            <button
                type="submit"
                class="admin-login-btn"
            >

                लॉगिन करें

            </button>


        </form>


        <div
            id="memberProfile"
            style="display:none;"
        >


            <h2>

                सदस्य की जानकारी

            </h2>


            <p>

                <strong>

                    Member ID:

                </strong>

                <span id="profileMemberId"></span>

            </p>


            <p>

                <strong>

                    नाम:

                </strong>

                <span id="profileName"></span>

            </p>


            <p>

                <strong>

                    मोबाइल:

                </strong>

                <span id="profileMobile"></span>

            </p>


            <p>

                <strong>

                    सदस्यता:

                </strong>

                <span id="profileMembership"></span>

            </p>


            <p>

                <strong>

                    स्थिति:

                </strong>

                <span id="profileStatus"></span>

            </p>


            <button
                type="button"
                class="logout-btn"
                onclick="memberLogout()"
            >

                लॉगआउट करें

            </button>


        </div>


        <br>


        <a
            href="index.html"
            class="back-home"
        >

            ← होम पेज पर जाएँ

        </a>


    </div>


</section>


<script src="member-login.js"></script>


</body>

</html>
