<style>

/* =====================================================
   MEMBER LOGIN PAGE
===================================================== */

:root{
    --blue:#123b66;
    --blue2:#1d5d96;
    --orange:#ff7900;
    --green:#24834b;
    --dark:#092e60;
    --text:#263746;
    --muted:#68798a;
    --light:#f5f8fb;
    --border:#dfe7ed;
}

*{
    box-sizing:border-box;
}

body.member-page{
    margin:0;
    background:var(--light);
    color:var(--text);
    font-family:
        "Noto Sans Devanagari",
        "Mangal",
        Arial,
        sans-serif;
}

.member-page a{
    text-decoration:none;
}


/* =====================================================
   TOP BAR
===================================================== */

.member-topbar{
    background:var(--blue);
    color:#fff;
}

.member-topbar-inner{
    width:92%;
    max-width:1400px;
    min-height:42px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.member-contact{
    display:flex;
    align-items:center;
    gap:25px;
}

.member-contact span{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
}

.member-contact i{
    color:#ffb15c;
}

.member-social{
    display:flex;
    align-items:center;
    gap:14px;
}

.member-social a{
    color:#fff;
    font-size:14px;
}

.member-social a:hover{
    color:var(--orange);
}

.member-phone{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
}

.member-phone i{
    color:#ffb15c;
}


/* =====================================================
   HEADER
===================================================== */

.member-header{
    background:#fff;
    border-bottom:1px solid #e3e9ef;
}

.member-header-inner{
    width:92%;
    max-width:1400px;
    min-height:135px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.member-brand{
    display:flex;
    align-items:center;
    gap:18px;
    color:var(--blue);
}

.member-brand-logo{
    width:112px;
    height:112px;
    object-fit:contain;
}

.member-brand-text h1{
    margin:0;
    color:var(--blue);
    font-size:38px;
    line-height:1.2;
    font-weight:800;
}

.member-brand-text h1 span{
    color:var(--orange);
}

.member-brand-text p{
    margin:7px 0 0;
    color:var(--blue);
    font-size:17px;
    font-weight:700;
}


/* =====================================================
   HEADER CARDS
===================================================== */

.member-header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.member-header-card{
    min-width:165px;
    min-height:64px;

    padding:10px 13px;

    background:#fff;
    border:1px solid #dce4eb;
    border-radius:12px;

    display:flex;
    align-items:center;
    gap:10px;

    color:var(--blue);

    transition:.25s;
}

.member-header-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(18,59,102,.12);
}

.member-header-card-icon{
    width:42px;
    height:42px;
    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.member-current{
    border-color:var(--orange);
    background:#fffaf5;
}

.member-current .member-header-card-icon{
    background:#fff0e3;
    color:var(--orange);
}

.member-volunteer-card .member-header-card-icon{
    background:#eaf7ed;
    color:var(--green);
}

.member-admin-card{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
}

.member-admin-card .member-header-card-icon{
    background:rgba(255,255,255,.16);
    color:#fff;
}

.member-header-card-text{
    display:flex;
    flex-direction:column;
}

.member-header-card-text strong{
    font-size:14px;
}

.member-header-card-text small{
    margin-top:3px;
    font-size:10px;
    opacity:.75;
}


/* =====================================================
   NAVIGATION
===================================================== */

.member-nav{
    background:#082e63;
    min-height:56px;
    position:relative;
    z-index:100;
}

.member-nav-inner{
    width:92%;
    max-width:1400px;
    min-height:56px;
    margin:auto;

    display:flex;
    align-items:stretch;
}

.member-nav-link{
    min-height:56px;

    padding:0 17px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    color:#fff;

    font-size:14px;
    font-weight:700;
    white-space:nowrap;
}

.member-nav-link:hover,
.member-nav-link.active{
    background:var(--orange);
}

.member-dropdown{
    position:relative;
}

.member-dropdown-menu{
    display:none;

    position:absolute;
    top:56px;
    left:0;

    width:220px;

    background:#fff;

    border-top:3px solid var(--orange);

    box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.member-dropdown:hover .member-dropdown-menu{
    display:block;
}

.member-dropdown-menu a{
    display:block;
    padding:12px 15px;

    color:var(--text);

    font-size:13px;

    border-bottom:1px solid #edf1f4;
}

.member-dropdown-menu a:hover{
    background:#f3f7fa;
    color:var(--blue);
}


/* =====================================================
   BREADCRUMB
===================================================== */

.member-breadcrumb{
    background:#eef3f8;
    border-bottom:1px solid #dfe7ee;
}

.member-breadcrumb-inner{
    width:92%;
    max-width:1400px;
    min-height:46px;
    margin:auto;
